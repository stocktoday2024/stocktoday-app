version: "3.8"

services:
  # ── PostgreSQL Database ──────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: stocktoday_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stocktoday_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stocktoday_secure_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-stocktoday_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stocktoday_user} -d ${POSTGRES_DB:-stocktoday_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Next.js Web Application ──────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stocktoday_app
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-stocktoday_user}:${POSTGRES_PASSWORD:-stocktoday_secure_password_2026}@postgres:5432/${POSTGRES_DB:-stocktoday_db}?schema=public"
      AUTH_SECRET: ${AUTH_SECRET:-stocktoday-production-secret-token-32-chars-minimum}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NODE_ENV: production
    ports:
      - "3000:3000"

volumes:
  postgres_data:
